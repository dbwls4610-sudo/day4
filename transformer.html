      books.forEach(b => { const u = b.userData, c = ((s * 0.55 + u.off) % 4) / 4, y = lerp(12, 0.3 + (b.id % 5) * 0.05, easeInOut(c * 1.1)); b.position.set(u.x, y, u.z); b.rotation.set(0, u.ry + s * 0.5, c * 2.2); b.scale.setScalar(clamp(1.6 - c * 1.2, 0.4, 1)); });
      const cyc = 12, c = s % cyc, p = easeInOut(c / 10), wob = Math.sin(s * 5) * 0.03 * (1 - p), v = [lerp(0.18, 0.95, p) + wob, lerp(0.5, 0.03, p) - wob, lerp(0.32, 0.02, p) + wob];

}
// 8. 정리
{
  const g = grp(), STEP = [['🧩', '쪼개기', '#ff9ab0'], ['🗺️', '숫자 지도', '#ffd27a'], ['👀', '집중하기', '#8fd3ff'], ['🏢', '생각 층 쌓기', '#a6e89a'], ['🎯', '맞히기', '#c9b3ff']], tiles = [];
  STEP.forEach(([e, n, c], i) => { const t = new THREE.Group(), body = new THREE.Mesh(new RoundedBoxGeometry(2.3, 2.9, 0.7, 5, 0.3), mat(c)); t.add(body); const em = textSprite(e, 1.2, { size: 110, sw: 0 }); em.position.set(0, 0.5, 0.5); t.add(em); const nm = textSprite(n, 0.6, { size: 66, color: '#3a2a5a', sw: 6, stroke: '#fff' }); nm.position.set(0, -0.8, 0.5); t.add(nm);
    const nb = textSprite(String(i + 1), 0.7, { size: 70, bg: '#fff', color: '#d6336c', sw: 0 }); nb.position.set(-0.85, 1.35, 0.55); t.add(nb); t.position.set((i - 2) * 3.1, 0, 0); g.add(t); tiles.push(t); });
  const loop = textSprite('🔁 이걸 계속 반복!', 0.95, { size: 80, bg: '#ff6fa5', color: '#fff', sw: 0 }); loop.position.set(0, 2.9, 0); g.add(loop);
  const names = textSprite('ChatGPT · Gemini · Claude 모두 이렇게 말해요!', 0.8, { size: 70, bg: '#fff', color: '#3a2a5a', sw: 0 }); names.position.set(0, -2.7, 0); g.add(names);
  scenes.push({
    title: '🎉 정리! AI가 말하는 방법', text: '① 말을 블록으로 쪼개고 ② 숫자 지도에 올리고 ③ 서로 집중해서 보고 ④ 생각하는 층을 지나서 ⑤ 다음 말을 맞혀요. 그리고 이걸 계속 반복해요. 참 쉽죠?',
    adult: 'ChatGPT·Gemini·Claude 등 현재의 대화형 AI는 모두 트랜스포머 계열이에요. (세부 구조·학습 방법은 모델마다 달라요. 이 애니메이션은 핵심 원리를 아주 단순화한 거예요.)',
    cam: [[0, 1.6, 15], [0, 0.4, 0]],
    enter() { g.visible = true; hideAll(); burst(new V3(0, 3, 0), PAL, 60, 6); },
    update(s, dt) { tiles.forEach((t, i) => { const e = easeOutBack((s - i * 0.25) / 0.7); t.scale.setScalar(Math.max(0.001, e)); t.position.y = Math.sin(s * 2 + i) * 0.18; t.rotation.y = Math.sin(s * 1.2 + i) * 0.15; });
      if (Math.random() < 0.5) burst(new V3(rnd(-9, 9), 8, rnd(-2, 2)), PAL, 1, 0.5, { life: 2, size: 1.2, v: new V3(0, -2, 0) }); },
    exit() { g.visible = false; },

}

/* ---------- 진행 UI / 음성 ---------- */
const dots = $('dots'); scenes.forEach((_, i) => { const d = document.createElement('i'); d.onclick = () => go(i, true); dots.appendChild(d); });
let voiceOn = true, autoOn = false, autoT = 0;
const clean = s => s.replace(/[\u{1F000}-\u{1FAFF}☀-➿️]/gu, '').replace(/[()]/g, ' ');
let voice = null;
function speak(text) {
  talking = false; if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); if (!voiceOn) return;
  const u = new SpeechSynthesisUtterance(clean(text)); u.lang = 'ko-KR'; if (!voice) voice = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko')); if (voice) u.voice = voice;
  u.pitch = 1.35; u.rate = 0.95; u.onstart = () => talking = true; u.onend = u.onerror = () => talking = false; speechSynthesis.speak(u);
}
function go(i, user) {
  i = clamp(i, 0, scenes.length - 1); if (cur >= 0) scenes[cur].exit(); cur = i; st = 0; const sc = scenes[i]; setSub('');
  $('stepTag').textContent = `${i + 1} / ${scenes.length}`; $('cTitle').textContent = sc.title; $('cText').textContent = sc.text; $('adult').textContent = '👨‍🏫 어른용 설명: ' + sc.adult;
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i)); camGoal.pos.set(...sc.cam[0]); camGoal.look.set(...sc.cam[1]); sc.enter(); speak(sc.title + '. ' + sc.text);
  autoT = Math.max(9, sc.text.length * 0.2); if (user) { }
}
$('prev').onclick = () => go(cur - 1, true); $('next').onclick = () => go(cur + 1, true);
$('auto').onclick = () => { autoOn = !autoOn; $('auto').classList.toggle('on', autoOn); autoT = Math.max(9, scenes[cur].text.length * 0.2); st = 0; };
$('voice').onclick = () => { voiceOn = !voiceOn; $('voice').classList.toggle('on', voiceOn); $('voice').textContent = voiceOn ? '🔊 읽어주기' : '🔇 소리 끔'; if (voiceOn) speak(scenes[cur].title + '. ' + scenes[cur].text); else speechSynthesis.cancel(); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1, true); } else if (e.key === 'ArrowLeft') go(cur - 1, true); });
$('go').onclick = () => { $('intro').classList.add('hidden'); go(0); };
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- 메인 루프 ---------- */
go(0); speechSynthesis && speechSynthesis.cancel(); $('intro').classList.remove('hidden');
const clock = new THREE.Clock(); const sw = new V3();
const frameFn = (dtIn) => {
  const dt = dtIn ?? Math.min(clock.getDelta(), 0.05); T += dt; st += dt;
  const sc = scenes[cur]; if (sc) sc.update(st, dt);
  if (autoOn && !$('intro').classList.contains('hidden') === false && st > autoT) { if (cur < scenes.length - 1) go(cur + 1); else autoOn = false, $('auto').classList.remove('on'); }
  stepBlocks(dt, T); updSparks(dt); updBubbles(dt, T); updMascot(T);
  const asp = camera.aspect, ds = clamp(1.55 / asp, 1, 2.2), look = camGoal.look, sway = sc && sc.sway ? sc.sway : 0.06, a = T * (sc && sc.sway ? 0.35 : 0.4);
  sw.set(camGoal.pos.x - look.x, camGoal.pos.y - look.y, camGoal.pos.z - look.z).multiplyScalar(ds);
  const th = (sc && sc.sway ? Math.sin(a) * 0.8 : Math.sin(a) * 0.05), oy = Math.sin(a * 0.7) * 0.2, cs = Math.cos(th), sn = Math.sin(th);
  camera.position.lerp(new V3(look.x + sw.x * cs + sw.z * sn, look.y + sw.y + oy, look.z - sw.x * sn + sw.z * cs), damp(dt, 2.2));
  camLook.lerp(look, damp(dt, 3)); camera.lookAt(camLook);

renderer.setAnimationLoop(() => frameFn());
window.__step = (sec) => { for (let i = 0; i < sec * 20; i++) frameFn(0.05); };
window.__go = go; window.__scenes = scenes; window.__T = () => T;
