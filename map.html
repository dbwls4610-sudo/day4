<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #map { height: 60vh; }
        #list { padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="bar">
        <select id="area">
            <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
        </select>
        <select id="indoor">
            <option value="">실내/야외 전체</option>
            <option value="true">실내</option>
            <option value="false">야외</option>
        </select>
        <button id="go">찾기</button>
        <span id="msg"></span>
    </div>
    <div id="map"></div>
    <ul id="list"></ul>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="jeju_spots.js"></script>
    <script src="lib/tools.js"></script>
    <script>
        // 장소별 좌표가 없어서 지역 중심점 근처에 흩어 찍는다 (정확한 위치 아님)
        const CENTER = {
            "동쪽(성산)": [33.458, 126.942], "동쪽(구좌)": [33.524, 126.862],
            "제주시": [33.4996, 126.5312],
            "서쪽(한림)": [33.414, 126.265], "서쪽(안덕)": [33.250, 126.310],
            "서귀포": [33.2541, 126.5601],
        }
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        document.getElementById("go").onclick = () => {
            const area = document.getElementById("area").value
            const v = document.getElementById("indoor").value
            const indoor = v === "" ? undefined : v === "true"
            const r = jejuTools.find_spots({ area, indoor })

            layer.clearLayers()
            const list = document.getElementById("list")
            list.innerHTML = ""
            document.getElementById("msg").textContent = `${r.count}곳 중 ${r.spots.length}곳 표시`

            const points = []
            r.spots.forEach((s, i) => {
                const c = CENTER[s.areas]
                const p = [c[0] + Math.sin(i * 2.4) * 0.03, c[1] + Math.cos(i * 2.4) * 0.03]
                points.push(p)
                const label = `${s.name} (${s.areas}, ${s.indoor ? "실내" : "야외"}) — ${s.desc}`
                L.marker(p).addTo(layer).bindPopup(label)
                list.innerHTML += `<li>${label}</li>`
            })
            if (points.length) map.fitBounds(points, { padding: [40, 40] })
        }
    </script>
</body>
</html>
