<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three.js Animation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  canvas { display: block; }
  #go {
    position: fixed; right: 16px; top: 14px; z-index: 1; display: flex; gap: 8px;
  }
  #go a {
    padding: 10px 18px; border-radius: 8px;
    background: #1c2a55; color: #cfe0ff; border: 1px solid #4a5fa0; text-decoration: none;
    font: 14px system-ui, sans-serif;
  }
  #go a:hover { background: #2a3d7a; }
  #hint {
    position: fixed; left: 16px; bottom: 12px; color: #8fa0c8;
    font: 13px/1.4 system-ui, sans-serif; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="go"><a href="space.html">🚀 우주 여행 시작</a> <a href="jeju.html">🌋 제주도 여행</a> <a href="game.html">🍊 감귤 게임</a> <a href="racing.html">🏎 제주 레이싱</a> <a href="transformer.html">🤖 AI는 어떻게 말할까?</a></div>
<div id="hint">드래그: 회전 · 휠: 확대/축소 · 클릭: 색상 변경</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060f, 0.025);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// Lights
scene.add(new THREE.AmbientLight(0x404060, 1.5));
const light1 = new THREE.PointLight(0xff4fa3, 120, 60);
const light2 = new THREE.PointLight(0x35d0ff, 120, 60);
scene.add(light1, light2);

// Central torus knot
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2.2, 0.65, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0x8a6bff, metalness: 0.7, roughness: 0.25 })
);
scene.add(knot);

// Wireframe shell
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(5, 1),
  new THREE.MeshBasicMaterial({ color: 0x35d0ff, wireframe: true, transparent: true, opacity: 0.25 })
);
scene.add(shell);

// Orbiting spheres
const orbiters = [];
for (let i = 0; i < 12; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 24, 24),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(i / 12, 0.9, 0.6),
      emissive: new THREE.Color().setHSL(i / 12, 0.9, 0.35),
    })
  );
  m.userData = { r: 6.5 + (i % 3) * 0.8, speed: 0.4 + (i % 4) * 0.15, phase: (i / 12) * Math.PI * 2, tilt: (i % 5) * 0.35 };
  orbiters.push(m);
  scene.add(m);
}

// Starfield
const N = 2500;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 30 + Math.random() * 70;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  pos[i * 3] = r * Math.sin(p) * Math.cos(t);
  pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
  pos[i * 3 + 2] = r * Math.cos(p);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, sizeAttenuation: true }));
scene.add(stars);

// Click: random palette
addEventListener('click', () => {
  const h = Math.random();
  knot.material.color.setHSL(h, 0.8, 0.6);
  light1.color.setHSL(h, 1, 0.6);
  light2.color.setHSL((h + 0.5) % 1, 1, 0.6);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  knot.rotation.x = t * 0.3;
  knot.rotation.y = t * 0.45;
  knot.scale.setScalar(1 + Math.sin(t * 1.5) * 0.06);

  shell.rotation.y = -t * 0.15;
  shell.rotation.z = t * 0.1;

  for (const o of orbiters) {
    const { r, speed, phase, tilt } = o.userData;
    const a = t * speed + phase;
    o.position.set(Math.cos(a) * r, Math.sin(a * 2) * 1.5 + Math.sin(a) * r * Math.sin(tilt), Math.sin(a) * r * Math.cos(tilt));
  }

  light1.position.set(Math.cos(t) * 8, Math.sin(t * 0.7) * 5, Math.sin(t) * 8);
  light2.position.set(-Math.cos(t * 0.8) * 8, Math.cos(t * 0.5) * 5, -Math.sin(t * 0.8) * 8);

  stars.rotation.y = t * 0.01;

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
